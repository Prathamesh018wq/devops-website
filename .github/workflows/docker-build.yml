name: Docker Build CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devops-website:ci \
            -t prathamesh018/devops-website:${{ github.sha }} \
            -t prathamesh018/devops-website:latest .

      - name: Test website response
        run: docker run --rm -d --name ci-health-test -p 8080:80 devops-website:ci

      - name: Verify website health
        run: |
          sleep 2
          curl --fail http://localhost:8080

      - name: Cleanup test container
        if: always()
        run: docker rm -f ci-health-test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push prathamesh018/devops-website:${{ github.sha }}
          docker push prathamesh018/devops-website:latest
